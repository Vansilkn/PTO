{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать статью</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Чтобы Bootstrap-классы применялись к чекбоксам внутри списка Django */
        ul[id^="id_"] {
            list-style: none;
            padding-left: 0;
        }
        ul[id^="id_"] > li {
            margin-bottom: 0.5rem;
        }
        ul[id^="id_"] > li > label {
            margin-left: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="mb-4">Новая статья</h2>
            <form method="post">
                {% csrf_token %}

                <!-- Заголовок -->
                <div class="mb-3">
                    <label class="form-label" for="{{ form.title.id_for_label }}">
                        {{ form.title.label }}
                    </label>
                    {{ form.title }}
                    {% if form.title.errors %}
                        <div class="text-danger">{{ form.title.errors }}</div>
                    {% endif %}
                </div>

                <!-- Вертикальный список чекбоксов -->
                <div class="mb-3">
                    <label class="form-label d-block mb-2">{{ form.categories.label }}</label>
                    {{ form.categories }}
                    {% if form.categories.errors %}
                        <div class="text-danger">{{ form.categories.errors }}</div>
                    {% endif %}
                </div>

                <!-- Одиночный чекбокс -->
                <div class="mb-3 form-check">
                    {{ form.public1 }}
                    <label class="form-check-label" for="{{ form.public1.id_for_label }}">
                        {{ form.public1.label }}
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
